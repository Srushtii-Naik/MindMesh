# MindMesh — Production Nginx reverse-proxy config.
#
# Used by docker-compose.prod.yml for local production-topology
# verification (ROADMAP.md Milestone 12). Adds what nginx.conf (the dev
# config) defers: rate-limit zones (PROJECT_RULES.md Section 8 — "Rate
# limiting on auth and AI-chat endpoints ... enforced at the Nginx and/or
# DRF throttling layer"), security headers, and gzip. TLS termination is
# handled by the deployment platform's edge (Railway) rather than here —
# see infra/nginx/nginx.conf's docstring and the Railway deployment docs
# in README.md for where certificates are actually terminated in the real
# production topology.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=120r/m;

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 512;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Tighter zone for auth endpoints — DRF's ScopedRateThrottle
    # (config/settings/base.py) already enforces per-scope limits
    # application-side; this is the Nginx-layer backstop PROJECT_RULES.md
    # Section 8 calls for "at minimum".
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ai/ {
        limit_req zone=ai_zone burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=general_zone burst=30 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        limit_req zone=general_zone burst=30 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /health {
        proxy_pass http://backend/api/v1/health/;
        access_log off;
    }
}
