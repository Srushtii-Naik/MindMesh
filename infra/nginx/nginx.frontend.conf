# MindMesh — Frontend static-build Nginx config.
#
# Used only by the local production-build verification stack
# (docker-compose.prod.yml, ROADMAP.md Milestone 12 — "Production Docker
# builds verified"). The real production frontend deployment is Vercel
# (PROJECT_RULES.md Section 2), which handles SPA routing and headers
# equivalently via its own platform configuration.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers (ARCHITECTURE.md Section 10). Mirrors the
    # Django-side headers in config/settings/production.py so the two
    # deployment paths (self-hosted via Nginx vs. Vercel) present the same
    # security posture.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Hashed asset filenames (Vite's default) are safe to cache forever;
    # index.html is not, since it's how clients pick up a new deployment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — React Router owns client-side routing, so every path
    # that doesn't match a real static file resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
